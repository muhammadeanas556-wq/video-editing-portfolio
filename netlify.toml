# Merge this into your existing netlify.toml (keep your own [build] / publish settings).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: no [[redirects]] for /api are needed. netlify/functions/api.mjs claims /api/* itself
# (export const config.path) and accepts every HTTP method (GET/POST/PUT/DELETE).
# Delete any OLD /api/* redirect from netlify.toml or from a _redirects file in your publish folder.
